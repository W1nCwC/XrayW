syntax = "proto3";

package xrayw.app.dispatcher;
option go_package = "github.com/W1nCwC/XrayW/app/dispatcher";

// Config selects the XrayW dispatcher, which wraps Xray's DefaultDispatcher
// with per-user device limiting and rate limiting. It carries no fields: the
// limiter is configured at runtime through the Go API.
message Config {}
